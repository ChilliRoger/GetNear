# ==========================================================================
# CRE WORKFLOW SETTINGS FILE — Private Treasury
# ==========================================================================
# Workflow-specific settings for the private treasury CRE workflow.
# Orchestrates privacy-preserving swaps via the Unlink privacy server.
# Each target defines user-workflow and workflow-artifacts groups.
# Settings here override CRE Project Settings File values.

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "meridian-private-treasury"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""


# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "meridian-private-treasury"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""
