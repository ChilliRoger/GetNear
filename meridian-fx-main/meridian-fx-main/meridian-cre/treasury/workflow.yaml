# ==========================================================================
# CRE WORKFLOW SETTINGS FILE
# ==========================================================================
# Workflow-specific settings for CRE CLI targets.
# Each target defines user-workflow and workflow-artifacts groups.
# Settings here override CRE Project Settings File values.
#
# DON deployment note: config.json contains the Oracle API URL and Uniswap
# API key in plaintext for local simulation. On DON deployment, these would
# be moved to an encrypted secrets file (secrets-path) so they are only
# decrypted inside the TEE — node operators never see the raw values.

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "meridian-treasury"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""  # On DON: point to encrypted secrets file for API keys


# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "meridian-treasury"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""  # On DON: encrypted secrets — Oracle URL, API keys decrypted only inside TEE
