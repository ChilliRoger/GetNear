name: fynd

services:
  fynd:
    image: ghcr.io/propeller-heads/fynd:latest
    restart: unless-stopped
    environment:
      TYCHO_API_KEY: ${TYCHO_API_KEY:?set TYCHO_API_KEY in .env}
      RPC_URL: ${RPC_URL:-https://eth.llamarpc.com}
      RUST_LOG: ${RUST_LOG:-fynd=info}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: ${FYND_HTTP_PORT:-3000}
    command:
      - --chain
      - ${FYND_CHAIN:-ethereum}
    ports:
      - ${FYND_HTTP_PORT:-3000}:3000
      - ${FYND_METRICS_PORT:-9898}:9898
    networks:
      - app

networks:
  app:
    driver: bridge
